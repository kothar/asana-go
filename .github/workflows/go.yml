name: Go

on:
  push:
    branches: [ develop, main ]
  # No branch filter: this fires on every pull request whatever its base, so
  # that stacked PRs (one review branch based on another) still get CI. With
  # a filter here they are silently skipped rather than reported as pending.
  pull_request:

# Least privilege by default. A job-level permissions block replaces this one
# outright rather than merging with it, so any job needing more has to respell
# contents: read alongside what it adds.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # Don't leave the job's token in .git/config where any later step,
        # including the third-party actions below, could read it.
        persist-credentials: false

    # Track the latest patch of the module's declared minimum Go line (go.mod
    # says go 1.26.0). Pinning an exact patch would leave the build on a
    # toolchain with known stdlib vulnerabilities as new patches are released.
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: '1.26.x'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uploads SARIF to the Security tab
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # Don't leave the job's token in .git/config where any later step,
        # including the third-party actions below, could read it.
        persist-credentials: false

    # govulncheck-action sets up Go itself. govulncheck@latest tracks the latest
    # Go release, so run the security scan on the current stable toolchain. The
    # build/test job above still validates against the module's declared minimum
    # Go version.
    - name: Run govulncheck
      uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
      with:
        go-version-input: 'stable'
        go-package: './...'

    - name: Run gosec Security Scanner
      uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'

    - name: Upload gosec results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      if: always()
      with:
        sarif_file: 'gosec-results.sarif'
        # Distinct per tool: both jobs upload SARIF for the same commit and
        # ref, and Code Scanning matches analyses by category. Without one
        # the two uploads collide and whichever lands second fails.
        category: gosec

  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uploads SARIF to the Security tab
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # Don't leave the job's token in .git/config where any later step,
        # including the third-party actions below, could read it.
        persist-credentials: false

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        # Distinct per tool: both jobs upload SARIF for the same commit and
        # ref, and Code Scanning matches analyses by category. Without one
        # the two uploads collide and whichever lands second fails.
        category: trivy
