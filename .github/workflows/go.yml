name: Go

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

# Least privilege by default. A job-level permissions block replaces this one
# outright rather than merging with it, so any job needing more has to respell
# contents: read alongside what it adds.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        # Don't leave the job's token in .git/config where any later step,
        # including the third-party actions below, could read it.
        persist-credentials: false

    # Track the latest patch of the module's declared minimum Go line (go.mod
    # says go 1.26.0). Pinning an exact patch would leave the build on a
    # toolchain with known stdlib vulnerabilities as new patches are released.
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.x'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uploads SARIF to the Security tab
    steps:
    - uses: actions/checkout@v6
      with:
        # Don't leave the job's token in .git/config where any later step,
        # including the third-party actions below, could read it.
        persist-credentials: false

    # govulncheck-action sets up Go itself. govulncheck@latest tracks the latest
    # Go release, so run the security scan on the current stable toolchain. The
    # build/test job above still validates against the module's declared minimum
    # Go version.
    - name: Run govulncheck
      uses: golang/govulncheck-action@v1
      with:
        go-version-input: 'stable'
        go-package: './...'

    - name: Run gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'

    - name: Upload gosec results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'gosec-results.sarif'

  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uploads SARIF to the Security tab
    steps:
    - uses: actions/checkout@v6
      with:
        # Don't leave the job's token in .git/config where any later step,
        # including the third-party actions below, could read it.
        persist-credentials: false

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
