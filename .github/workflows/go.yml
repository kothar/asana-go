name: Go

on:
  push:
    branches: [ develop, main ]
  # No branch filter: this fires on every pull request whatever its base, so
  # that stacked PRs (one review branch based on another) still get CI. With
  # a filter here they are silently skipped rather than reported as pending.
  pull_request:

# Least privilege by default. A job-level permissions block replaces this one
# outright rather than merging with it, so any job needing more has to respell
# contents: read alongside what it adds.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Don't leave the job's token in .git/config where any later step,
        # including the third-party actions below, could read it.
        persist-credentials: false

    # Track the latest patch of the module's declared minimum Go line (go.mod
    # says go 1.26.0). Pinning an exact patch would leave the build on a
    # toolchain with known stdlib vulnerabilities as new patches are released.
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: '1.26.x'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  # Runs the suite in integration/ against a scratch Asana workspace. It needs
  # the ASANA_TEST_PAT secret and the ASANA_TEST_WORKSPACE variable (plus
  # ASANA_TEST_TEAM if that workspace is an organization). Without them, as on
  # pull requests from forks and Dependabot, the tests skip rather than fail.
  integration:
    runs-on: ubuntu-latest
    # One run at a time: every run shares the scratch workspace and its rate
    # limit. Queued runs wait rather than cancelling one another midway, which
    # would leave objects behind for the sweeper.
    concurrency:
      group: asana-integration
      cancel-in-progress: false
    env:
      ASANA_TEST_PAT: ${{ secrets.ASANA_TEST_PAT }}
      ASANA_TEST_WORKSPACE: ${{ vars.ASANA_TEST_WORKSPACE }}
      ASANA_TEST_TEAM: ${{ vars.ASANA_TEST_TEAM }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Don't leave the job's token in .git/config where any later step,
        # including the third-party actions below, could read it.
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: '1.26.x'

    - name: Warn when credentials are missing
      if: env.ASANA_TEST_PAT == '' || env.ASANA_TEST_WORKSPACE == ''
      run: echo "::warning::ASANA_TEST_PAT or ASANA_TEST_WORKSPACE is not set, so the Asana integration tests will be skipped"

    - name: Integration test
      run: go test -v -count=1 -timeout 15m ./integration/...

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uploads SARIF to the Security tab
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Don't leave the job's token in .git/config where any later step,
        # including the third-party actions below, could read it.
        persist-credentials: false

    # govulncheck-action sets up Go itself. govulncheck@latest tracks the latest
    # Go release, so run the security scan on the current stable toolchain. The
    # build/test job above still validates against the module's declared minimum
    # Go version.
    - name: Run govulncheck
      uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
      with:
        go-version-input: 'stable'
        go-package: './...'

    - name: Run gosec Security Scanner
      uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'

    - name: Upload gosec results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      if: always()
      with:
        sarif_file: 'gosec-results.sarif'
        # Distinct per tool: both jobs upload SARIF for the same commit and
        # ref, and Code Scanning matches analyses by category. Without one
        # the two uploads collide and whichever lands second fails.
        category: gosec

  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uploads SARIF to the Security tab
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Don't leave the job's token in .git/config where any later step,
        # including the third-party actions below, could read it.
        persist-credentials: false

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        # Distinct per tool: both jobs upload SARIF for the same commit and
        # ref, and Code Scanning matches analyses by category. Without one
        # the two uploads collide and whichever lands second fails.
        category: trivy
